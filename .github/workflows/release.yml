name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Validate tag version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package version ($PACKAGE_VERSION)."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit and integration tests
        run: pnpm test:coverage

      - name: Build and package Chrome
        run: pnpm build && pnpm zip

      - name: Resolve release artifacts
        id: artifacts
        run: |
          ZIP_FILES="$(find .output -maxdepth 1 -name '*.zip' -print)"
          if [ -z "$ZIP_FILES" ]; then
            echo "No release artifacts found in .output/"
            exit 1
          fi
          while IFS= read -r zip; do sha256sum "$zip" > "${zip}.sha256"; done <<< "$ZIP_FILES"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: FormSafe ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
          files: .output/*.zip*
