name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Validate tag version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package version ($PACKAGE_VERSION)."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build extension
        run: pnpm build

      - name: Package extension zip
        run: pnpm zip

      - name: Resolve release artifacts
        id: artifacts
        run: |
          ZIP_FILE="$(ls .output/*.zip | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No zip release artifact found in .output/"
            exit 1
          fi
          SHA_FILE="${ZIP_FILE}.sha256"
          sha256sum "$ZIP_FILE" > "$SHA_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "sha_file=$SHA_FILE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.artifacts.outputs.zip_file }}
            ${{ steps.artifacts.outputs.sha_file }}
